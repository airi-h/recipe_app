{% extends 'base.html' %} {% block content %}
<div class="container mx-auto p-8">
  <h2 class="text-3xl font-bold mb-6">⭐ お気に入りレシピ一覧</h2>
  <ul class="space-y-4">
    {% for fav in favorites %}
    <li>
      <a
        href="{% url 'recipes:recipe_detail' pk=fav.recipe.recipe_id %}"
        class="block p-4 bg-white rounded-lg shadow hover:bg-gray-100"
      >
        {{ fav.recipe.title }}
      </a>
    </li>
    {% empty %}
    <li class="text-gray-500">お気に入りレシピがまだありません。</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
