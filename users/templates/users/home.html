{% extends 'base.html' %} {% block content %}
<div
  class="min-h-screen bg-gradient-to-br from-gray-100 flex items-center justify-center py-6 overflow-x-hidden"
>
  <div class="container max-w-xl mx-auto p-8 bg-white rounded-3xl">
    <h1 class="text-5xl font-bold text-gray-800 mb-10 text-center">My Recipe</h1>

    <div class="text-center mb-8">
      <h2 class="text-3xl font-semibold text-gray-700 mb-4 border-b-2 border-gray-300 pb-2">
        Home
      </h2>
      <p class="text-3xl text-gray-600 mb-6">レシピアプリへようこそ!! {{ request.user }}さん</p>
    </div>

    <ul class="space-y-4">
      <li>
        <a
          href="{% url 'recipes:recipe_list' %}"
          class="text-3xl block text-gray-700 bg-gray-200 hover:bg-gray-300 hover:scale-105 py-3 px-6 rounded-lg transition transform duration-200 max-w-md mx-auto text-center shadow-sm"
        >
          📋 レシピ一覧
        </a>
      </li>
      <li>
        <a
          href="{% url 'recipes:recipe_create' %}"
          class="text-3xl block text-white bg-blue-500 hover:bg-blue-600 hover:scale-105 py-3 px-6 rounded-lg transition transform duration-200 max-w-md mx-auto text-center shadow-sm"
        >
          🆕 レシピ投稿
        </a>
      </li>
      <li>
        <a
          href="{% url 'recipes:recipe_search' %}"
          class="text-3xl block text-white bg-green-500 hover:bg-green-600 hover:scale-105 py-3 px-6 rounded-lg transition transform duration-200 max-w-md mx-auto text-center"
        >
          🔍 レシピ検索
        </a>
      </li>
      <li>
        <a
          href="{% url 'users:profile' %}"
          class="text-3xl block text-white bg-yellow-500 hover:bg-yellow-600 hover:scale-105 py-3 px-6 rounded-lg transition transform duration-200 max-w-md mx-auto text-center"
        >
          👤 プロフィール管理
        </a>
      </li>
      <li>
        <a
          href="{% url 'users:logout' %}"
          class="text-3xl block text-white bg-red-500 hover:bg-red-600 hover:scale-105 py-3 px-6 rounded-lg transition transform duration-200 max-w-md mx-auto text-center"
        >
          🚪 ログアウト
        </a>
      </li>
    </ul>
  </div>
</div>
{% endblock %}
